version: 2

models:
  - name: fct_orders
    description: "Hechos a nivel de pedido: una fila por pedido."
    columns:
      - name: order_id
        data_tests:
          - unique
          - not_null
      - name: customer_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_customer')
                field: customer_id
      - name: order_status
        data_tests:
          - not_null