version: 2

models:
  - name: fct_orders
    description: "Order fact table."

    columns:
      - name: order_id
        description: "Unique order identifier."
        data_tests:
          - not_null
          - unique

      - name: customer_id
        description: "Customer associated with the order."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_customer')
                field: customer_id

      - name: order_status
        description: "Current status of the order."
        data_tests:
          - not_null