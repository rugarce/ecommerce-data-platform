version: 2

models:
  - name: fct_order_items
    description: "Hechos a nivel de línea de pedido: una fila por producto en cada pedido."
    columns:
      - name: order_item_id
        description: "Identificador de la línea de pedido."
        data_tests:
          - unique
          - not_null
      - name: order_id
        description: "Pedido al que pertenece la línea."
        data_tests:
          - not_null
          - relationships:
              to: ref('fct_orders')
              field: order_id
      - name: product_id
        description: "Producto vendido."
        data_tests:
          - not_null
          - relationships:
              to: ref('dim_product')
              field: product_id
      - name: customer_id
        description: "Cliente que hizo el pedido."
        data_tests:
          - not_null
          - relationships:
              to: ref('dim_customer')
              field: customer_id