version: 2

models:
  - name: dim_product
    description: "Product dimension."

    columns:
      - name: product_id
        description: "Unique product identifier."
        data_tests:
          - not_null
          - unique

      - name: product_name
        description: "Product name."
        data_tests:
          - not_null

      - name: price
        description: "Product price."
        data_tests:
          - not_null

      - name: category
        description: "Product category."
        data_tests:
          - not_null